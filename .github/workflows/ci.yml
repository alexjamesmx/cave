name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      # restic for deploy/cave-offsite's test; Ubuntu's package is older than the VPS's pinned
      # 0.19.1, and the commands the script uses exist in both.
      - run: sudo apt-get update -q && sudo apt-get install -y -q restic
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test
